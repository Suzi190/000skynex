name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || true
          # runner 自带的 cmdline-tools 版本号会变（16.0 / latest…），取第一个可用目录。
          # 不装 tools 包（新版本 sdkmanager 已经没有它了，会直接报错退出）。
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1 || true)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" || true
          else
            echo "no sdkmanager found, relying on preinstalled SDK"
          fi

      - name: Install npm deps
        run: npm ci

      - name: Generate www/ from single-file HTML
        run: node scripts/sync-www.js

      - name: Capacitor copy into android project
        run: npx cap copy android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/*.apk "out/skynex-debug.apk"
          ls -lh out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: skynex-debug-apk
          path: out/skynex-debug.apk
          retention-days: 30

      # 打一个滚动的 latest-apk 标签并挂上 APK，方便手机直接点链接下载
      - name: Publish rolling release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: skynex APK (latest)
          body: |
            自动构建的调试版 APK（commit ${{ github.sha }}）。
            直接点下方 `skynex-debug.apk` 下载安装即可。
          files: out/skynex-debug.apk
          prerelease: true
          fail_on_unmatched_files: true
